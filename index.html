<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="WUE DESIGN 屋已设计工作室作品、流程、奖项与联系入口。" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://yy587.github.io/wue/" />
    <link rel="icon" type="image/png" href="/wue/cursor-logo.png" />
    <title>WUE DESIGN 屋已设计工作室</title>
    <style>
      :root {
        --line: rgba(20, 24, 28, 0.16);
        --text: #202326;
        --muted: rgba(32, 35, 38, 0.58);
      }
      * { box-sizing: border-box; }
      html { background: #fff; color: var(--text); font-family: Arial, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; }
      body { margin: 0; min-height: 100vh; cursor: url("/wue/cursor-default.png") 10 10, auto; }
      a { color: inherit; text-decoration: none; cursor: url("/wue/cursor-interactive.png") 32 32, pointer; }
      .shell { width: min(1720px, calc(100vw - 120px)); margin: 0 auto; }
      header { height: 98px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: #fff; }
      .brand { display: flex; align-items: center; gap: 16px; letter-spacing: 0.24em; font-size: 13px; font-weight: 600; }
      .brand img { width: 24px; height: 24px; object-fit: contain; }
      nav { display: flex; align-items: center; gap: 28px; font-size: 12px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }
      nav a:hover { color: var(--text); }
      main { padding: 58px 0 72px; }
      .intro { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.55fr); gap: 96px; align-items: end; margin-bottom: 58px; }
      .eyebrow { font-size: 13px; letter-spacing: 0.42em; color: var(--muted); margin-bottom: 28px; text-transform: uppercase; }
      h1 { margin: 0; font-weight: 300; font-size: clamp(52px, 7vw, 118px); line-height: 0.96; letter-spacing: -0.055em; }
      .copy { font-size: 15px; line-height: 2; color: rgba(32,35,38,.68); max-width: 420px; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 44px; align-items: start; }
      .card { display: block; }
      .image { background: #f7f7f7; overflow: hidden; }
      .image img { width: 100%; height: auto; display: block; transition: transform .7s ease; }
      .card:hover img { transform: scale(1.018); }
      .meta { display: grid; grid-template-columns: 42px 1fr auto; gap: 18px; align-items: baseline; margin-top: 16px; font-size: 13px; line-height: 1.5; }
      .num, .type { color: var(--muted); letter-spacing: .14em; }
      .title { color: var(--text); letter-spacing: .04em; }
      .wide { grid-column: span 2; }
      .links { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 70px; border-top: 1px solid var(--line); padding-top: 28px; }
      .links a { font-size: 13px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }
      .links a:hover { color: var(--text); }
      @media (max-width: 900px) {
        .shell { width: min(100% - 40px, 720px); }
        header { height: 76px; }
        nav { gap: 14px; font-size: 10px; }
        .intro, .grid, .links { grid-template-columns: 1fr; gap: 28px; }
        .wide { grid-column: span 1; }
        main { padding-top: 38px; }
      }
    </style>
  </head>
  <body>
    <header class="shell">
      <a class="brand" href="/wue/">
        <img src="/wue/cursor-logo.png" alt="" />
        <span>WUE DESIGN</span>
      </a>
      <nav aria-label="Primary">
        <a href="/wue/projects">作品</a>
        <a href="/wue/process">流程</a>
        <a href="/wue/awards">奖项</a>
        <a href="/wue/contact">联系</a>
      </nav>
    </header>
    <main class="shell">
      <section class="intro">
        <div>
          <div class="eyebrow">WUE DESIGN / WORKS</div>
          <h1>屋已设计<br />工作室</h1>
        </div>
        <p class="copy">以清晰的空间秩序、材料叙事与生活细节，持续完成住宅、商业与品牌空间设计。</p>
      </section>
      <section class="grid" aria-label="Featured projects">
        <a class="card wide" href="/wue/projects/studio-office">
          <div class="image"><img src="/wue/assets/studio-office-section-CqfBIOxW.png" alt="屋已设计办公室" /></div>
          <div class="meta"><span class="num">01</span><span class="title">屋已设计办公室</span><span class="type">商业设计</span></div>
        </a>
        <a class="card" href="/wue/projects/shasha-coffee">
          <div class="image"><img src="/wue/assets/22-B61pTDli.webp" alt="沙沙冷萃园" /></div>
          <div class="meta"><span class="num">02</span><span class="title">沙沙冷萃园</span><span class="type">商业设计</span></div>
        </a>
        <a class="card" href="/wue/projects/horizontal-window-house">
          <div class="image"><img src="/wue/assets/horizontal-window-house-uniform-DWZmU87m.png" alt="横窗之家" /></div>
          <div class="meta"><span class="num">03</span><span class="title">横窗之家</span><span class="type">住宅设计</span></div>
        </a>
        <a class="card wide" href="/wue/process">
          <div class="image"><img src="/wue/assets/process-04-schematic-design.webp" alt="设计流程" /></div>
          <div class="meta"><span class="num">04</span><span class="title">设计流程</span><span class="type">Process</span></div>
        </a>
      </section>
      <section class="links" aria-label="Site links">
        <a href="/wue/projects">View Projects →</a>
        <a href="/wue/process">Design Process →</a>
        <a href="/wue/awards">Recognition →</a>
        <a href="/wue/contact">Contact →</a>
      </section>
    </main>
  </body>
</html>
